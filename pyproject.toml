[project]
name = "coinpile"
version = "0.1.0"
description = "Coinpile: a simple view of your Firefly III, with an agent, and a remote control for the Plaid connector"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "httpcore>=1.0", "uvicorn>=0.29", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
